quarkus.quinoa.package-manager=pnpm
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.ui-dir=src/main/frontend
quarkus.quinoa.enable-spa-routing=true
# Quinoa proxying Vite's HMR websocket desyncs the dev-server connection
# (blank page, Netty "no request in progress" errors). Disabling costs
# live-reload (manual refresh needed) but doesn't affect prod/Lambda.
%dev.quarkus.quinoa.dev-server.websocket=false

# CORS disabled - frontend is same-origin via Quinoa. Already the
# default; made explicit so it reads as deliberate, not an oversight.
quarkus.http.cors.enabled=false

# AWS Lambda configuration. HTTP API (vs REST API) is chosen by which
# extension is on the classpath (quarkus-amazon-lambda-http, below), not by
# a config property - there's no such thing as quarkus.lambda.endpoint-mode.
quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest

# Database configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:mysql://cs320db-ecommerce.c1kkoo8gsl55.us-west-2.rds.amazonaws.com:3306/ecommerce_db
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://cs320db-ecommerce.c1kkoo8gsl55.us-west-2.rds.amazonaws.com:3306/ecommerce_db?sslMode=DISABLED
%dev.quarkus.http.idle-timeout=2s
quarkus.hibernate-orm.schema-management.strategy=update

# Tests run against an in-memory H2 database instead of the real RDS
# instance above, so @QuarkusTest never touches real data.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
# NON_KEYWORDS=USER tells H2 to stop treating USER as a reserved word, since
# the User entity is mapped to a real table literally named "User" (MySQL has
# no such reservation, so this only ever bites the H2 test database).
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;NON_KEYWORDS=USER
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Quarkus Mailer already defaults to mock=true for the test profile
# (same as dev did before we overrode it above), so password-reset/
# change-password tests never hit real Resend SMTP.

# Cookie configuration to avoid issues when running in dev mode
app.cookie.secure=true
%dev.app.cookie.secure=false

quarkus.mailer.from=onboarding@resend.dev
quarkus.mailer.host=smtp.resend.com
quarkus.mailer.port=587
quarkus.mailer.username=resend
quarkus.mailer.password=${RESEND_API_KEY}
quarkus.mailer.start-tls=REQUIRED

app.base-url=https://yourapp.com
%dev.app.base-url=http://localhost:8080
# Quarkus Mailer defaults to mock=true in dev mode regardless of other config,
# so it must be explicitly disabled here to actually send via Resend locally.
%dev.quarkus.mailer.mock=false

# Stripe configuration - test-mode keys
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Tests never make a real Stripe call (StripeCheckoutService gets mocked in
# controller tests), but Quarkus validates every @ConfigProperty at startup
# regardless of whether the owning bean is ever actually used - so these
# need *some* value, even a fake one, or the whole suite fails to boot.
%test.app.stripe.secret-key=sk_test_fake_key_for_tests
%test.app.stripe.webhook-secret=whsec_fake_secret_for_tests

# The same reasoning as the %test fallback above - quarkus:dev needs SOME value here to boot at
# all, even before a real Stripe account exists. Checkout/webhook endpoints won't work
# correctly with a fake key, but the rest of the app (browsing, cart, etc.) will run fine.
# This always overrides STRIPE_SECRET_KEY/STRIPE_WEBHOOK_SECRET from .env, even if set - to
# test real Stripe checkout locally, comment out these two lines and uncomment+fill in the
# matching values in .env.
%dev.app.stripe.secret-key=sk_test_dev_placeholder
%dev.app.stripe.webhook-secret=whsec_dev_placeholder

# Rate limiting - see RateLimitService. Window is a fixed 1-hour
# constant in code; only the per-endpoint attempt ceiling is configurable.
app.rate-limit.register.max-attempts=5
app.rate-limit.password-reset-request.max-attempts=5
app.rate-limit.password-reset-confirm.max-attempts=10

# High enough that the existing test suite's incidental register/reset
# calls across dozens of unrelated tests never trip it - real throttling
# behavior gets tested separately via a low @TestProfile override.
%test.app.rate-limit.register.max-attempts=10000
%test.app.rate-limit.password-reset-request.max-attempts=10000
%test.app.rate-limit.password-reset-confirm.max-attempts=10000

# Basic Auth gate for /q/swagger-ui and /q/openapi in production only - lets
# the team reach API docs without exposing them to the public internet.
# /q/health is deliberately excluded - load balancers/orchestrators need to
# reach it without credentials.
%prod.quarkus.http.auth.basic=true
%prod.quarkus.security.users.embedded.enabled=true
%prod.quarkus.security.users.embedded.plain-text=true
%prod.quarkus.security.users.embedded.users.teamdocs=${TEAM_DOCS_PASSWORD}
%prod.quarkus.security.users.embedded.roles.teamdocs=docs-viewer
%prod.quarkus.http.auth.policy.docs-policy.roles-allowed=docs-viewer
%prod.quarkus.http.auth.permission.docs.paths=/q/swagger-ui*,/q/openapi*,/q/metrics*
%prod.quarkus.http.auth.permission.docs.policy=docs-policy
%prod.quarkus.swagger-ui.always-include=true